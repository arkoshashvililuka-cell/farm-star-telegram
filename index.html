<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080c12">
<title>Farm Stars</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#080c12;
  --panel:#121925;
  --panel2:#182130;
  --border:#29364a;
  --text:#fff;
  --muted:#8995a7;
  --gold:#ffc451;
  --green:#55dc98;
  --red:#ff6363;
  --blue:#54a9ff;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
body{min-height:100vh}
button{
  font:inherit;
  border:0;
  cursor:pointer;
}
button:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.app{
  max-width:600px;
  min-height:100vh;
  margin:auto;
  padding-bottom:90px;
}
header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(8,12,18,.96);
  backdrop-filter:blur(16px);
  border-bottom:1px solid #202b3a;
}
.header{
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
}
.logo{
  font-size:20px;
  font-weight:900;
}
.balance{
  display:flex;
  align-items:center;
  gap:6px;
  padding:9px 12px;
  border-radius:13px;
  background:#1a2331;
  border:1px solid #303d51;
  font-weight:900;
}
main{padding:14px}
.page{display:none}
.page.active{display:block}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px;
  margin-bottom:13px;
}
.card h2{
  margin:0 0 8px;
  font-size:21px;
}
.muted{
  color:var(--muted);
  line-height:1.45;
}
.small{font-size:12px}
.btn{
  width:100%;
  padding:13px 15px;
  margin-top:9px;
  border-radius:13px;
  background:linear-gradient(135deg,#ffd35e,#ff982c);
  color:#1b1205;
  font-weight:900;
}
.btn.secondary{
  background:#252f3f;
  color:#fff;
}
.btn.green{
  background:linear-gradient(135deg,#62e9a3,#36bd7b);
}
.btn.blue{
  background:linear-gradient(135deg,#68b8ff,#4186ef);
  color:#071322;
}
.back{
  padding:10px 13px;
  border-radius:12px;
  background:#252f3f;
  color:white;
  margin-bottom:12px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.game{
  min-height:145px;
  padding:14px;
  border-radius:18px;
  background:#151e2c;
  border:1px solid #29364a;
  color:white;
  text-align:left;
}
.game:active{transform:scale(.98)}
.game-icon{
  font-size:34px;
  margin-bottom:9px;
}
.game-title{
  font-size:16px;
  font-weight:900;
}
.game-desc{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
  line-height:1.35;
}
.hero{
  background:
    radial-gradient(circle at 90% 10%,#385e3b 0,#16261b 40%,#121925 100%);
}
.level-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.progress{
  width:100%;
  height:9px;
  background:#070b10;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}
.progress div{
  height:100%;
  background:linear-gradient(90deg,#45d887,#b3ff75);
  border-radius:20px;
  transition:width:.3s;
}
.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
.stat{
  padding:12px;
  border-radius:14px;
  background:#192230;
  border:1px solid #29364a;
}
.stat span{
  color:var(--muted);
  font-size:12px;
}
.stat b{
  display:block;
  font-size:19px;
  margin-top:5px;
}
.farm-coins{
  padding:13px;
  text-align:center;
  background:#17291f;
  border:1px solid #315b42;
  border-radius:15px;
  margin-bottom:13px;
}
.farm-coins b{
  display:block;
  margin-top:4px;
  color:var(--green);
  font-size:23px;
}
.farm-scene{
  padding:10px;
  border-radius:18px;
  background:linear-gradient(#3e7745,#203d25);
}
.farm-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.farm-tile{
  min-height:92px;
  border-radius:13px;
  border:1px solid #9b7447;
  background:#75502d;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  font-size:30px;
}
.farm-tile small{
  color:#f3e7d5;
  font-size:10px;
}
.farm-tile.building{
  background:#526371;
  border-color:#758697;
}
.section-title{
  margin:18px 0 9px;
  font-size:16px;
  font-weight:900;
}
.upgrade,
.shop-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px;
  margin-top:8px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:14px;
}
.upgrade-info,
.shop-info{
  min-width:0;
}
.upgrade-info b,
.shop-info b{
  display:block;
  margin-bottom:4px;
}
.upgrade-info span,
.shop-info span{
  color:var(--muted);
  font-size:12px;
}
.upgrade button,
.shop-item button{
  flex-shrink:0;
  padding:9px 11px;
  border-radius:10px;
  background:#ffb23d;
  color:#201505;
  font-weight:900;
}
.wheel-wrap{
  display:flex;
  justify-content:center;
  position:relative;
  margin:22px 0;
}
.pointer{
  position:absolute;
  z-index:5;
  top:-15px;
  font-size:31px;
  filter:drop-shadow(0 2px 4px #000);
}
.wheel{
  position:relative;
  width:min(78vw,310px);
  height:min(78vw,310px);
  border-radius:50%;
  border:9px solid #303b4d;
  overflow:hidden;
  box-shadow:0 8px 30px #0008;
  transition:transform 4s cubic-bezier(.12,.72,.18,1);
  background:
    conic-gradient(
      #ff765f 0deg 60deg,
      #ffc857 60deg 120deg,
      #51d99a 120deg 180deg,
      #4da4ff 180deg 240deg,
      #a871ff 240deg 300deg,
      #ff5e9d 300deg 360deg
    );
}
.wheel-label{
  position:absolute;
  left:50%;
  top:50%;
  width:47%;
  height:25px;
  margin-top:-12px;
  transform-origin:0 50%;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding-right:10px;
  color:#171717;
  font-weight:900;
  font-size:12px;
  white-space:nowrap;
}
.wheel-center{
  position:absolute;
  z-index:3;
  left:50%;
  top:50%;
  width:62px;
  height:62px;
  margin:-31px;
  border-radius:50%;
  background:#111722;
  border:5px solid #445065;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}
.prize-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:10px;
}
.prize{
  padding:9px;
  border-radius:11px;
  background:#192230;
  border:1px solid #29364a;
  text-align:center;
  font-size:12px;
  font-weight:800;
}
.result{
  display:none;
  text-align:center;
  padding:14px;
  border-radius:15px;
  background:#18291f;
  border:1px solid #376148;
  margin-top:12px;
}
.result.show{display:block}
.result b{
  font-size:24px;
  display:block;
  margin-top:5px;
}
.mines{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  max-width:370px;
  margin:15px auto;
}
.mine{
  aspect-ratio:1;
  border-radius:10px;
  background:#29364a;
  border:1px solid #3c4b62;
  color:white;
  font-size:20px;
}
.mine.safe{background:#245b42}
.mine.bomb{background:#8b3232}
.mine.done{opacity:.9}
.game-status{
  text-align:center;
  padding:10px;
  border-radius:12px;
  background:#192230;
  color:var(--muted);
}
.guess-number{
  text-align:center;
  font-size:62px;
  font-weight:900;
  margin:18px 0;
}
.guess-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.history{
  display:flex;
  gap:6px;
  overflow:auto;
  padding-bottom:3px;
}
.history-item{
  flex:0 0 48px;
  height:48px;
  border-radius:12px;
  background:#192230;
  border:1px solid #29364a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}
.rocket{
  min-height:300px;
  border-radius:20px;
  background:
    radial-gradient(circle at 50% 70%,#284a67 0,#101b2a 35%,#080c12 70%);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:35px;
}
.rocket-mult{
  position:absolute;
  top:35px;
  font-size:52px;
  font-weight:900;
}
.rocket-ship{
  font-size:65px;
  transition:transform .15s;
}
.stars-bg{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.5;
  background-image:
    radial-gradient(circle,#fff 1px,transparent 1px),
    radial-gradient(circle,#fff 1px,transparent 1px);
  background-size:75px 75px,110px 110px;
  background-position:10px 20px,45px 65px;
}
.profile{text-align:center}
.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #303d51;
  background:#1c2736;
}
.profile-name{
  font-size:22px;
  font-weight:900;
  margin-top:10px;
}
.profile-username{
  color:var(--muted);
  margin-top:4px;
}
.rank-table{
  width:100%;
  border-collapse:collapse;
}
.rank-table th{
  color:var(--muted);
  font-size:11px;
  font-weight:normal;
  padding:8px 4px;
  text-align:left;
}
.rank-table td{
  padding:10px 4px;
  border-top:1px solid #263142;
  font-size:12px;
}
.rank-user{
  display:flex;
  align-items:center;
  gap:7px;
}
.rank-avatar{
  width:30px;
  height:30px;
  border-radius:50%;
  object-fit:cover;
  background:#29364a;
}
.current-row{background:#1d3028}
.ref-link{
  width:100%;
  padding:11px;
  margin-top:10px;
  border-radius:11px;
  border:1px solid #334258;
  background:#0c121b;
  color:#fff;
  font-size:12px;
}
.nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(600px,100%);
  z-index:90;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(9,13,19,.97);
  border-top:1px solid #253142;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.nav button{
  background:transparent;
  color:#8290a4;
  padding:5px 2px;
  font-size:10px;
}
.nav button span{
  display:block;
  font-size:22px;
  margin-bottom:2px;
}
.nav button.active{color:#ffc451}
.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translate(-50%,20px);
  z-index:200;
  max-width:90%;
  padding:12px 16px;
  border-radius:13px;
  background:#202a38;
  border:1px solid #39485d;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  text-align:center;
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
.modal{
  position:fixed;
  inset:0;
  z-index:300;
  background:#0009;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal.show{display:flex}
.modal-box{
  width:min(390px,100%);
  background:#131b28;
  border:1px solid #344258;
  border-radius:22px;
  padding:22px;
  text-align:center;
}
.modal-icon{font-size:55px}
.modal-title{
  font-size:24px;
  font-weight:900;
  margin:9px 0;
}
@media(max-width:380px){
  .game{min-height:135px}
  .game-icon{font-size:29px}
  .game-title{font-size:14px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="header">
    <div class="logo">⭐ Farm Stars</div>
    <div class="balance">⭐ <span id="starsBalance">50</span></div>

</header>

<main>

    <p class="muted">

    <div class="level-row">

      <span id="homeXpText">0 / 100 XP</span>

    <div class="progress">
      <div id="homeXpBar" style="width:0%"></div>

  </div>

  <div class="card">
    <h2>🎮 Мини-игры</h2>

      <button class="game" onclick="openPage('lucky')">

      </button>

      <button class="game" onclick="openPage('mines')">
        <div class="game-icon">💣</div>
        <div class="game-title">Mines</div>
        <div class="game-desc">Открывай клетки и избегай мин.</div>
      </button>

      <button class="game" onclick="openPage('higher')">
        <div class="game-icon">🔼🔽</div>
        <div class="game-title">Больше или меньше</div>
        <div class="game-desc">Угадай, каким будет следующее число.</div>
      </button>

      <button class="game" onclick="openPage('rocket')">
        <div class="game-icon">🚀</div>
        <div class="game-title">Rocket Crash</div>
        <div class="game-desc">Следи за полётом ракеты и множителем.</div>
      </button>

    </div>
  </div>

  <div class="card">
    <h2>🎁 Ежедневная рулетка</h2>
    <p class="muted">Один бесплатный прокрут каждые 24 часа.</p>
    <button class="btn" onclick="openPage('daily')">
      Открыть ежедневную рулетку
    </button>
  </div>

</section>

<section id="page-lucky" class="page">

  <button class="back" onclick="openPage('home')">← Назад</button>

  <div class="card">
    <h2>🎰 Lucky Spin</h2>

    <div class="wheel-wrap">
      <div class="pointer">▼</div>

      <div id="luckyWheel" class="wheel">

        <div class="wheel-label" style="transform:rotate(
